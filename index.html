<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLux | Edition</title>

    <link rel="icon" type="image/png" href="./assets/img/favicon.png">
    <link rel="apple-touch-icon" href="./assets/img/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff2800">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #0a0a0a; 
            scroll-behavior: smooth; 
            overflow-x: hidden; 
        }
        .hero-bg { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1592193333411-2918737b989c?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
        }
        .card-lujo { 
            background: #111; 
            transition: all 0.4s ease; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .card-lujo:hover { 
            border-color: #ff2800; 
            transform: translateY(-10px); 
            box-shadow: 0 20px 40px rgba(255, 40, 0, 0.15); 
        }
        
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loader-logo {
            height: 60px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255, 40, 0, 0.5));
        }
        .loader-bar {
            width: 150px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .loader-bar-inner {
            position: absolute;
            height: 100%;
            width: 50%;
            background: #ff2800;
            animation: loading 2s infinite ease-in-out;
        }
        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }
        .opacity-0 { opacity: 0; visibility: hidden; }
        .opacity-100 { opacity: 1; visibility: visible; }

        .tabla-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="text-white overflow-hidden">

    <div id="loader">
        <img src="./assets/img/icon-192.png" alt="Cargando..." class="loader-logo animate-pulse">
        <div class="loader-bar"><div class="loader-bar-inner"></div></div>
    </div>

    <div id="app-content" class="opacity-0 transition-opacity duration-1000">
        
        <nav class="fixed w-full z-50 flex justify-between items-center px-6 md:px-10 py-4 backdrop-blur-md bg-black/40 border-b border-white/5">
            <div class="flex items-center gap-2 md:gap-4">
                <img src="./assets/img/icon-192.png" alt="AutoLux Logo" class="h-8 md:h-10 w-auto" onerror="this.src='https://cdn-icons-png.flaticon.com/512/741/741407.png'">
                <div class="flex flex-col leading-none">
                    <span class="text-lg md:text-xl font-bold tracking-[2px] md:tracking-[3px] text-white">AUTO<span class="text-[#ff2800]">LUX</span></span>
                    <span class="text-[6px] md:text-[8px] tracking-[2px] md:tracking-[4px] uppercase text-gray-400">Elite Motorsport</span>
                </div>
            </div>
            </nav>

        <header class="min-h-screen flex flex-col justify-center items-center text-center px-6 hero-bg">
            <h1 class="text-3xl sm:text-6xl md:text-8xl font-bold mb-4" data-aos="fade-down">PASIÓN PURA</h1>
            <p class="text-xs sm:text-lg md:text-2xl font-light tracking-[5px] md:tracking-[10px] mb-10 uppercase" data-aos="fade-up">Ingeniería al Límite</p>
            <a href="#catalogo" class="border border-[#ff2800] px-8 md:px-12 py-3 md:py-4 hover:bg-[#ff2800] transition duration-500 uppercase tracking-widest text-[10px] md:text-sm">Explorar Gama</a>
        </header>

        <main id="catalogo" class="py-20 md:py-24 px-6 md:px-10 max-w-7xl mx-auto">
            <h2 class="text-xl md:text-2xl font-light text-center mb-12 tracking-[10px] md:tracking-[15px] uppercase">Modelos Disponibles</h2>
            <div id="contenedor-autos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8"></div>
        </main>

        <div id="barra-comparar" class="fixed bottom-0 left-0 w-full bg-black/95 border-t border-[#ff2800] p-4 translate-y-full transition-transform duration-500 z-[60] flex justify-between items-center px-4 md:px-20 backdrop-blur-md">
            <div class="flex gap-2 md:gap-4" id="slots-comparar"></div>
            <div class="flex gap-2 md:gap-4">
                <button onclick="limpiarComparacion()" class="text-[8px] md:text-[10px] uppercase tracking-widest text-gray-500 hover:text-white">Limpiar</button>
                <button onclick="mostrarTablaComparativa()" class="bg-[#ff2800] px-4 md:px-6 py-2 text-[8px] md:text-[10px] font-bold uppercase tracking-widest hover:bg-white hover:text-black transition">Comparar</button>
            </div>
        </div>

        <div id="modal-detalle" class="fixed inset-0 z-[100] hidden bg-black/95 backdrop-blur-md flex items-start md:items-center justify-center p-4 overflow-y-auto">
            <div class="relative max-w-5xl w-full bg-[#111] border border-white/10 rounded-xl overflow-hidden shadow-2xl my-auto">
                <button onclick="cerrarModal()" class="absolute top-4 right-4 text-3xl text-gray-500 hover:text-[#ff2800] z-20">&times;</button>
                <div class="flex flex-col lg:flex-row">
                    <div class="w-full lg:w-2/3 h-[250px] sm:h-[350px] lg:h-auto">
                        <img id="modal-img" src="" alt="Vehículo" class="w-full h-full object-cover">
                    </div>
                    <div class="w-full lg:w-1/3 p-6 md:p-10 flex flex-col justify-center">
                        <h2 id="modal-titulo" class="text-2xl md:text-4xl font-bold mb-4 uppercase italic text-[#ff2800]"></h2>
                        <div id="modal-specs" class="space-y-3 mb-8 text-xs md:text-sm border-t border-white/10 pt-4 md:pt-6"></div>
                        <button onclick="irAlChatbot()" class="w-full bg-[#ff2800] py-3 md:py-4 font-bold uppercase tracking-widest text-[10px] md:text-xs hover:bg-white hover:text-black transition duration-300">Solicitar Cotización</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="modal-tabla" class="fixed inset-0 z-[110] hidden bg-black flex items-center justify-center p-2 md:p-4">
            <div class="bg-[#111] w-full max-w-4xl p-6 md:p-10 rounded-xl border border-white/10 relative overflow-y-auto max-h-[90vh]">
                <button onclick="cerrarTabla()" class="absolute top-4 right-4 text-3xl text-gray-500 hover:text-[#ff2800]">&times;</button>
                <h2 class="text-sm md:text-xl font-bold mb-8 text-center tracking-[5px] md:tracking-[10px] uppercase">Duelo de Ingeniería</h2>
                <div class="tabla-scroll">
                    <div id="tabla-contenido" class="grid grid-cols-3 gap-4 md:gap-6 text-center min-w-[500px] md:min-w-0"></div>
                </div>
            </div>
        </div>

    </div> 

    <script>
        window.onload = function() {
            const loader = document.getElementById('loader');
            const appContent = document.getElementById('app-content');
            
            setTimeout(() => {
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => {
                        loader.style.display = 'none';
                        if(appContent) {
                            appContent.classList.remove('opacity-0');
                            appContent.classList.add('opacity-100');
                        }
                        document.body.style.overflow = 'auto';
                        document.body.classList.remove('overflow-hidden');
                    }, 500);
                }
            }, 1000);
        };
    </script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
