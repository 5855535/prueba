<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLux | Elite Motorsport</title>

    <link rel="icon" type="image/png" href="./assets/img/favicon.png">
    <link rel="apple-touch-icon" href="./assets/img/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff2800">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: #0a0a0a; 
            scroll-behavior: smooth;
        }
        .hero-bg { 
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1592193333411-2918737b989c?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
        }
        .card-lujo { 
            background: #111; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .card-lujo:hover { 
            border-color: #ff2800; 
            transform: translateY(-12px); 
            box-shadow: 0 25px 50px rgba(255, 40, 0, 0.2); 
        }

        /* Loader */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        .loader-bar {
            width: 160px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 9999px;
            overflow: hidden;
        }
        .loader-bar-inner {
            height: 100%;
            width: 45%;
            background: #ff2800;
            animation: loading 1.8s infinite ease-in-out;
        }
        @keyframes loading {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(400%); }
        }
    </style>
</head>
<body class="text-white">

    <!-- LOADER -->
    <div id="loader">
        <img src="./assets/img/icon-192.png" alt="AutoLux" class="h-14 mb-6 animate-pulse">
        <div class="loader-bar">
            <div class="loader-bar-inner"></div>
        </div>
        <p class="mt-6 text-[10px] tracking-[3px] text-gray-500">CARGANDO EXPERIENCIA</p>
    </div>

    <div id="app-content" class="opacity-0 transition-opacity duration-700">

        <!-- NAVBAR -->
        <nav class="fixed w-full z-50 flex justify-between items-center px-6 md:px-10 py-5 backdrop-blur-md bg-black/70 border-b border-white/10">
            <div class="flex items-center gap-4">
                <img src="./assets/img/icon-192.png" alt="AutoLux Logo" class="h-10 w-auto">
                <div class="flex flex-col leading-none">
                    <span class="text-2xl font-bold tracking-[3px]">AUTO<span class="text-[#ff2800]">LUX</span></span>
                    <span class="text-[9px] tracking-[4px] uppercase text-gray-400">Elite Motorsport</span>
                </div>
            </div>
            
            <div class="flex items-center gap-8">
                <div class="hidden md:flex gap-8 text-xs uppercase tracking-[3px]">
                    <a href="#catalogo" class="hover:text-[#ff2800] transition">Modelos</a>
                    <a href="#" class="hover:text-[#ff2800] transition text-gray-400">Scuderia</a>
                </div>

                <!-- Botón de Cerrar Sesión -->
                <button id="btn-login-nav" 
                    onclick="logout()" 
                    class="border border-white/30 hover:border-red-500 hover:text-red-500 px-6 py-3 text-xs font-medium uppercase tracking-widest transition-all">
                    CERRAR SESIÓN
                </button>
            </div>
        </nav>

        <!-- HERO -->
        <header class="min-h-screen flex flex-col justify-center items-center text-center px-6 hero-bg">
            <h1 class="text-6xl md:text-8xl font-bold mb-4 tracking-tighter" data-aos="fade-down">PASIÓN PURA</h1>
            <p class="text-xl md:text-2xl font-light tracking-[8px] mb-12 uppercase" data-aos="fade-up">Ingeniería al Límite</p>
            <a href="#catalogo" 
               class="border-2 border-[#ff2800] hover:bg-[#ff2800] hover:text-black px-14 py-5 text-sm uppercase tracking-widest transition-all duration-300">
                Explorar Gama
            </a>
        </header>

        <!-- CATÁLOGO -->
        <main id="catalogo" class="py-24 px-6 md:px-10 max-w-7xl mx-auto">
            <h2 class="text-3xl font-light text-center mb-20 tracking-[12px] uppercase">Modelos Disponibles</h2>
            <div id="contenedor-autos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </main>

        <!-- BARRA DE COMPARACIÓN -->
        <div id="barra-comparar" class="fixed bottom-0 left-0 w-full bg-black/95 border-t border-[#ff2800] p-5 translate-y-full transition-transform duration-500 z-[60] hidden md:flex justify-between items-center px-6 lg:px-20 backdrop-blur-md">
            <div class="flex gap-4" id="slots-comparar"></div>
            <div class="flex gap-6">
                <button onclick="limpiarComparacion()" class="text-xs uppercase tracking-widest text-gray-400 hover:text-white">Limpiar</button>
                <button onclick="mostrarTablaComparativa()" 
                        class="bg-[#ff2800] px-8 py-3 text-xs font-bold uppercase tracking-widest hover:bg-white hover:text-black transition">
                    Comparar
                </button>
            </div>
        </div>

        <!-- MODAL DETALLE -->
        <div id="modal-detalle" class="fixed inset-0 z-[100] hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
            <div class="relative max-w-5xl w-full bg-[#111] border border-white/10 rounded-3xl overflow-hidden">
                <button onclick="cerrarModal()" class="absolute top-6 right-6 text-4xl text-gray-400 hover:text-white z-10">&times;</button>
                <div class="flex flex-col lg:flex-row">
                    <div class="lg:w-2/3 h-[320px] lg:h-auto">
                        <img id="modal-img" src="" alt="Vehículo" class="w-full h-full object-cover">
                    </div>
                    <div class="lg:w-1/3 p-10 flex flex-col justify-center">
                        <h2 id="modal-titulo" class="text-4xl font-bold mb-8 uppercase italic text-[#ff2800]"></h2>
                        <div id="modal-specs" class="space-y-6 mb-12 text-sm"></div>
                        <button onclick="irAlChatbot()" 
                                class="w-full bg-[#ff2800] py-5 font-bold uppercase tracking-widest hover:bg-white hover:text-black transition">
                            Solicitar Cotización
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MODAL TABLA COMPARACIÓN -->
        <div id="modal-tabla" class="fixed inset-0 z-[110] hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
            <div class="bg-[#111] w-full max-w-4xl p-10 rounded-3xl border border-white/10 relative max-h-[90vh] overflow-y-auto">
                <button onclick="cerrarTabla()" class="absolute top-6 right-6 text-4xl text-gray-400 hover:text-white">&times;</button>
                <h2 class="text-2xl font-bold mb-12 text-center tracking-widest uppercase">Duelo de Ingeniería</h2>
                <div id="tabla-contenido" class="grid grid-cols-3 gap-8 text-center"></div>
            </div>
        </div>

    </div> 

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module" src="main.js"></script>
    <script type="module" src="auth.js"></script>

    <!-- Protección de página + Logout -->
    <script type="module">
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const auth = getAuth();

        // Proteger la página: si no hay usuario logueado → redirigir a login
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        // Función global para cerrar sesión
        window.logout = () => {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.error("Error al cerrar sesión:", error);
            });
        };
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ once: true, duration: 800 });
        });
    </script>
</body>
</html>
